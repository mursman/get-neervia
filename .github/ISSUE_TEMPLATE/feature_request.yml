name: Feature request
description: An idea that would make Neervia better for you.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome — especially ones that come from a real transfer you do often.
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Android app
        - Windows app
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Neervia to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      description: The situation or problem behind the idea — that often matters more than the exact shape of the feature.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Examples from other apps, sketches, links — anything that shows what you mean.
